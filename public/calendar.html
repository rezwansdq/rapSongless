<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songless Archive — Play 100 Days of Past Song Puzzles</title>
    <meta name="description" content="Browse and replay every Songless daily music puzzle from the last 100 days. Pick any date and guess the songs you missed. Free, no signup.">
    <meta name="keywords" content="songless, songdle, song wordle, wordle for songs, music wordle, song guessing game, guess the song, guess the song game, daily song game, daily music game, heardle, heardle alternative, heardle replacement, music guessing game, name that tune, song quiz, music quiz, audio quiz, guess the song from the intro, daily music puzzle, song trivia, music trivia game, songless unlimited, free song game, online music game, intro quiz, guess the music, song of the day game">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="author" content="Rezwan Sadeqi">
    <meta name="theme-color" content="#111311">
    <meta name="apple-mobile-web-app-title" content="Songless">
    <meta name="application-name" content="Songless">

    <!-- Both playsongless.win and songdle.win serve this site; canonical tells
         search engines which copy to rank so the signal isn't split. -->
    <link rel="canonical" href="https://songdle.win/calendar">

    <!-- Open Graph (Facebook, Discord, iMessage, WhatsApp, Slack) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Songless">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Songless Archive — 100 Days of Song Puzzles">
    <meta property="og:description" content="Browse and replay every Songless daily music puzzle from the last 100 days. Pick any date and guess the songs you missed. Free, no signup.">
    <meta property="og:url" content="https://songdle.win/calendar">
    <meta property="og:image" content="https://songdle.win/images/og-image.png">
    <meta property="og:image:secure_url" content="https://songdle.win/images/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Songless — the daily song guessing game">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Songless Archive — 100 Days of Song Puzzles">
    <meta name="twitter:description" content="Browse and replay every Songless daily music puzzle from the last 100 days. Pick any date and guess the songs you missed. Free, no signup.">
    <meta name="twitter:image" content="https://songdle.win/images/og-image.png">
    <meta name="twitter:image:alt" content="Songless — the daily song guessing game">

    <script>
        // Runs before the stylesheet loads so html.is-embedded is set before
        // first paint — the embed banner below never causes a layout shift.
        try {
            if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
        } catch (e) {
            document.documentElement.classList.add('is-embedded');
        }
    </script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
      {
        "@type": "Organization",
        "@id": "https://songdle.win/#org",
        "name": "Songless",
        "url": "https://songdle.win/",
        "logo": "https://songdle.win/images/og-image.png"
      },
      {
        "@type": "VideoGame",
        "@id": "https://songdle.win/#game",
        "name": "Songless",
        "alternateName": ["Songdle", "Songless Unlimited", "Song Wordle"],
        "url": "https://songdle.win/",
        "description": "A free daily song guessing game. Hear a fraction of a second of a track and name it; every wrong guess unlocks a longer snippet.",
        "image": "https://songdle.win/images/og-image.png",
        "inLanguage": "en",
        "genre": ["Music", "Puzzle", "Trivia", "Word Game"],
        "playMode": "SinglePlayer",
        "gamePlatform": ["Web browser", "Desktop", "Mobile"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "author": { "@type": "Person", "name": "Rezwan Sadeqi" },
        "publisher": { "@id": "https://songdle.win/#org" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Songless", "item": "https://songdle.win/" },
          { "@type": "ListItem", "position": 2, "name": "Past Days", "item": "https://songdle.win/calendar" }
        ]
      }
      ]
    }
    </script>
</head>

<body>
    <div id="embed-banner" class="embed-banner" role="banner">
        <p class="embed-banner-text">
            Not playing on our site?
            <a class="embed-banner-link" href="https://songdle.win" target="_top" rel="noopener noreferrer">Click
                here to play fullscreen on songdle.win</a>
        </p>
        <button id="embed-banner-dismiss" class="embed-banner-dismiss" aria-label="Dismiss">✕</button>
    </div>
    <canvas id="notesBg"></canvas>
    <div class="container">
        <section id="calendar-page" class="screen active">
            <div class="page-header">
                <a href="/" class="back-link">‹ Home</a>
                <h1 class="page-title">Past Days</h1>
                <span class="page-header-spacer" aria-hidden="true"></span>
            </div>

            <p id="calendar-summary" class="calendar-summary"></p>

            <div class="month-nav">
                <button id="prev-month" class="month-btn" aria-label="Previous month">‹</button>
                <p id="month-label" class="month-label"></p>
                <button id="next-month" class="month-btn" aria-label="Next month">›</button>
            </div>

            <div id="calendar-grid" class="calendar-grid"></div>

            <div class="calendar-legend">
                <span class="legend-item"><span class="legend-swatch legend-swatch--complete"></span>Played</span>
                <span class="legend-item"><span class="legend-swatch legend-swatch--partial"></span>Unfinished</span>
                <span class="legend-item"><span class="legend-swatch"></span>Available</span>
                <span class="legend-item"><span class="legend-swatch legend-swatch--locked"></span>Locked</span>
            </div>
        </section>
    </div>

    <footer>
        <p>Rezwan Sadeqi &copy; 2026</p>
    </footer>

    <!-- Saved results for one day -->
    <div id="day-result-modal" class="modal-overlay recap-modal-overlay">
        <div class="recap-card">
            <h2 id="day-result-heading" class="recap-heading">Results</h2>
            <div>
                <p id="day-result-score" class="recap-score"></p>
                <p id="day-result-sub" class="recap-score-sub"></p>
            </div>
            <div id="day-result-list" class="recap-song-list"></div>
            <p id="day-result-summary" class="recap-summary"></p>
            <div class="recap-actions recap-actions--stacked">
                <button id="day-result-share-btn" class="btn btn-primary recap-share-btn">Share</button>
                <div class="recap-actions-secondary">
                    <button id="day-result-replay-btn" class="btn btn-ghost recap-close-btn">Play Again</button>
                    <button id="day-result-close-btn" class="btn btn-ghost recap-close-btn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/calendar.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
