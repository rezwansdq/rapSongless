<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songless Unlimited - Game</title>
    <script>
        // Runs before the stylesheet loads so html.is-embedded is set before
        // first paint — the embed banner below never causes a layout shift.
        try {
            if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
        } catch (e) {
            document.documentElement.classList.add('is-embedded');
        }
    </script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
</head>

<body>
    <div id="embed-banner" class="embed-banner" role="banner">
        <p class="embed-banner-text">
            Not playing on our site?
            <a class="embed-banner-link" href="https://songdle.win" target="_top" rel="noopener noreferrer">Click
                here to play fullscreen on songdle.win</a>
        </p>
        <button id="embed-banner-dismiss" class="embed-banner-dismiss" aria-label="Dismiss">✕</button>
    </div>
    <canvas id="notesBg"></canvas>
    <div class="container">
        <section id="game-screen" class="screen">
            <div class="game-main">
                <div class="game-header">
                    <a href="/" id="back-to-home-button" class="home-icon-btn">‹ Home</a>
                    <h1 class="game-title">Songless Unlimited</h1>
                    <button id="settings-button" class="settings-icon-btn" aria-label="Settings">⚙</button>
                </div>

                <div class="guess-boxes-container">
                    <div class="guess-box empty" data-index="0"></div>
                    <div class="guess-box empty" data-index="1"></div>
                    <div class="guess-box empty" data-index="2"></div>
                    <div class="guess-box empty" data-index="3"></div>
                    <div class="guess-box empty" data-index="4"></div>
                    <div class="guess-box empty" data-index="5"></div>
                </div>

                <div class="game-info">
                    <div class="stage-info">
                        <span id="stage-counter" class="stage-label">Stage 1</span>
                        <span id="stage-duration" class="stage-duration">0.2s</span>
                    </div>
                    <div id="timer-container">
                        <div class="time-display">
                            <div class="progress-bar-container">
                                <div id="progress-bar" class="progress-bar-fill"></div>
                            </div>
                        </div>
                        <div id="timer" class="current-time">0.0s</div>
                    </div>
                </div>

                <div class="play-control">
                    <button id="play-pause-button" class="play-btn" aria-label="Play snippet">
                        <span class="play-icon">▶</span>
                    </button>
                </div>

                <div class="game-controls">
                    <div class="search-container">
                        <input type="text" id="guess-input" placeholder="Know it? Search for the title">
                        <div id="autocomplete-results" class="autocomplete-results"></div>
                    </div>
                    <div class="button-container">
                        <button id="skip-button" class="btn">Skip</button>
                        <button id="submit-button" class="btn btn-primary">Submit</button>
                    </div>
                </div>

                <!-- Daily progress — shown below the controls in daily mode -->
                <aside id="daily-progress-panel" class="daily-progress-panel">
                    <p id="progress-panel-label" class="progress-panel-label">Today's Songs</p>
                    <div id="progress-panel-items" class="progress-panel-items"></div>
                </aside>
            </div>
        </section>
    </div>

    <!-- Success -->
    <div id="success-modal" class="modal">
        <div class="modal-content success">
            <h2 id="success-message">Got it</h2>
            <img id="success-album-art" class="modal-album-art" src="" alt="" style="display: none;">
            <p id="success-song-info">Song Title - Artist</p>
            <button id="play-next-button" class="btn btn-primary">Play Next</button>
        </div>
    </div>

    <!-- Failure -->
    <div id="failure-modal" class="modal">
        <div class="modal-content failure">
            <h2 id="failure-message">Out of guesses</h2>
            <img id="failure-album-art" class="modal-album-art" src="" alt="" style="display: none;">
            <p id="failure-song-info">The song was: Song Title - Artist</p>
            <button id="try-again-button" class="btn btn-primary">Play Next</button>
        </div>
    </div>

    <div id="loading-overlay" class="loading-screen-overlay">
        <div class="loading-message">Finding song</div>
    </div>

    <!-- Settings -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content settings-content">
            <button id="close-settings-button" class="close-btn" aria-label="Close">✕</button>
            <h2 class="modal-title">Settings</h2>
            <div class="setting-item">
                <label for="volume-slider-modal" class="volume-label">Volume</label>
                <input type="range" id="volume-slider-modal" min="0" max="100" value="50" step="10">
            </div>
        </div>
    </div>

    <!-- Recap, shown once the day's songs are done -->
    <div id="recap-modal" class="modal-overlay recap-modal-overlay">
        <div class="recap-card">
            <h2 class="recap-heading">Today's Results</h2>
            <div>
                <p class="recap-score"></p>
                <p class="recap-score-sub"></p>
            </div>
            <div class="recap-song-list"></div>
            <p class="recap-summary"></p>
            <div class="recap-actions">
                <button id="recap-share-btn" class="btn btn-primary recap-share-btn">Share</button>
                <button id="recap-close-btn" class="btn btn-ghost recap-close-btn">Close</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Rezwan Sadeqi &copy; 2026</p>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
